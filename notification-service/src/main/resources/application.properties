spring.application.name=notification-service
server.port=8087

# Exclude JPA/DataSource AutoConfiguration since notification-service doesn't use a database
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.jdbc.DataSourceAutoConfiguration,org.springframework.boot.autoconfigure.orm.jpa.HibernateJpaAutoConfiguration,org.springframework.boot.autoconfigure.jdbc.DataSourceTransactionManagerAutoConfiguration

# Centralized Config Server (Optional fallback to local properties)
spring.config.import=optional:configserver:http://localhost:8888

# Eureka Service Discovery
eureka.client.service-url.defaultZone=http://localhost:8761/eureka

# Disable Spring Cloud compatibility check
spring.cloud.compatibility-verifier.enabled=false

# Observability & Tracing
management.endpoints.web.exposure.include=health,info,metrics
management.tracing.sampling.probability=1.0

# Kafka Consumer Configuration
spring.kafka.bootstrap-servers=${SPRING_KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.consumer.group-id=notification-group
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.properties.spring.json.trusted.packages=*

# Spring Mail (Free Gmail SMTP or mock fallback)
spring.mail.host=${SPRING_MAIL_HOST:smtp.gmail.com}
spring.mail.port=${SPRING_MAIL_PORT:587}
spring.mail.username=${SPRING_MAIL_USERNAME:beerakavenkatesh1997@gmail.com}
spring.mail.password=${SPRING_MAIL_PASSWORD:aikc ikoj cxsm ozhl}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
