spring.application.name=admin-service
server.port=8086

# Centralized Config Server (Optional fallback to local properties)
spring.config.import=optional:configserver:http://localhost:8888

# Eureka Service Discovery
eureka.client.service-url.defaultZone=http://localhost:8761/eureka

# Disable Spring Cloud compatibility check
spring.cloud.compatibility-verifier.enabled=false

# Database Configuration (PostgreSQL)
spring.datasource.url=jdbc:postgresql://localhost:5432/parkingslots
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA Configuration
spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# JWT Secret
JwtUtil.SECRET_KEY=parkingslotsecretkeyparkingslotsecretkey123

# Resilience4j Circuit Breaker Configuration
resilience4j.circuitbreaker.instances.adminStatsService.sliding-window-size=10
resilience4j.circuitbreaker.instances.adminStatsService.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.adminStatsService.wait-duration-in-open-state=10000ms
resilience4j.circuitbreaker.instances.adminStatsService.permitted-number-of-calls-in-half-open-state=3

resilience4j.circuitbreaker.instances.adminBookingsService.sliding-window-size=10
resilience4j.circuitbreaker.instances.adminBookingsService.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.adminBookingsService.wait-duration-in-open-state=10000ms

# Resilience4j Retry Configuration
resilience4j.retry.instances.adminStatsService.max-attempts=3
resilience4j.retry.instances.adminStatsService.wait-duration=1s
resilience4j.retry.instances.adminStatsService.enable-exponential-backoff=true

# Observability (Actuator & Distributed Tracing)
management.endpoints.web.exposure.include=health,info,metrics
management.tracing.sampling.probability=1.0
