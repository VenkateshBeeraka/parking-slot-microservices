# Global Centralized Configuration managed by Config Server
spring.datasource.url=jdbc:postgresql://localhost:5432/parkingslots
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Centralized JWT Secret
JwtUtil.SECRET_KEY=parkingslotsecretkeyparkingslotsecretkey123

# Service Registry
eureka.client.service-url.defaultZone=http://localhost:8761/eureka

# Observability
management.endpoints.web.exposure.include=health,info,metrics
management.tracing.sampling.probability=1.0
