spring.application.name=api-gateway
server.port=8765

eureka.client.service-url.defaultZone=http://localhost:8761/eureka

# Disable Spring Cloud compatibility check
spring.cloud.compatibility-verifier.enabled=false

# Observability & Actuator CORS
management.endpoints.web.exposure.include=health,info,metrics,gateway
management.tracing.sampling.probability=1.0
management.endpoints.web.cors.allowed-origin-patterns=*
management.endpoints.web.cors.allowed-methods=GET,POST,OPTIONS
management.endpoints.web.cors.allowed-headers=*
management.endpoints.web.cors.allow-credentials=true

# Global CORS Configuration for Gateway
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowed-origin-patterns=*
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowed-methods=GET,POST,PUT,DELETE,OPTIONS,HEAD,PATCH
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowed-headers=*
spring.cloud.gateway.globalcors.cors-configurations.[/**].allow-credentials=true

# SpringDoc OpenAPI & Swagger UI Configuration
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=alpha
springdoc.swagger-ui.tags-sorter=alpha
springdoc.swagger-ui.doc-expansion=none
springdoc.swagger-ui.url=/auth-service/v3/api-docs
springdoc.swagger-ui.persist-authorization=true

# Aggregated Microservices OpenAPI URLs
springdoc.swagger-ui.urls-primary-name=Auth Service
springdoc.swagger-ui.urls[0].name=Auth Service
springdoc.swagger-ui.urls[0].url=/auth-service/v3/api-docs
springdoc.swagger-ui.urls[1].name=User Service
springdoc.swagger-ui.urls[1].url=/user-service/v3/api-docs
springdoc.swagger-ui.urls[2].name=Building Service
springdoc.swagger-ui.urls[2].url=/building-service/v3/api-docs
springdoc.swagger-ui.urls[3].name=Slot Service
springdoc.swagger-ui.urls[3].url=/slot-service/v3/api-docs
springdoc.swagger-ui.urls[4].name=Availability Service
springdoc.swagger-ui.urls[4].url=/availability-service/v3/api-docs
springdoc.swagger-ui.urls[5].name=Admin Service
springdoc.swagger-ui.urls[5].url=/admin-service/v3/api-docs
springdoc.swagger-ui.urls[6].name=Notification Service
springdoc.swagger-ui.urls[6].url=/notification-service/v3/api-docs

