spring.application.name=availability-service
server.port=8085

# Database Configuration (PostgreSQL)
spring.datasource.url=jdbc:postgresql://localhost:5432/parkingslots
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA Configuration
spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Centralized Config Server (Optional fallback to local properties)
spring.config.import=optional:configserver:http://localhost:8888

# Eureka Service Discovery
eureka.client.service-url.defaultZone=http://localhost:8761/eureka

# Disable Spring Cloud compatibility check
spring.cloud.compatibility-verifier.enabled=false

# JWT Secret
JwtUtil.SECRET_KEY=parkingslotsecretkeyparkingslotsecretkey123

# Observability
management.endpoints.web.exposure.include=health,info,metrics
management.tracing.sampling.probability=1.0

# Kafka Producer Configuration
spring.kafka.bootstrap-servers=${SPRING_KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
spring.kafka.producer.properties.spring.json.add.type.headers=true
