spring.application.name=availability-service
server.port=8085

# Database Configuration (PostgreSQL)
spring.datasource.url=jdbc:postgresql://localhost:5432/parkingslots
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA Configuration
spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Centralized Config Server (Optional fallback to local properties)
spring.config.import=optional:configserver:http://localhost:8888

# Eureka Service Discovery
eureka.client.service-url.defaultZone=http://localhost:8761/eureka

# JWT Secret
JwtUtil.SECRET_KEY=parkingslotsecretkeyparkingslotsecretkey123

# Observability
management.endpoints.web.exposure.include=health,info,metrics
management.tracing.sampling.probability=1.0
